name: release
on:
  push:
    tags: ["v*"]
permissions: read-all
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release artifact inventory
        run: python3 scripts/validate_artifacts.py --release-version "${GITHUB_REF_NAME}"
      - name: Require chart and tag versions to agree
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$version" = "$(awk '/^version:/{print $2}' charts/among-clusters/Chart.yaml)"
          for chart in among-clusters-hub among-clusters-agent among-clusters-headlamp; do
            test "$version" = "$(awk '/^version:/{print $2}' charts/$chart/Chart.yaml)"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        run: printf '%s' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/re8ch/among-clusters:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign immutable image
        env: {DIGEST: "${{ steps.image.outputs.digest }}"}
        run: cosign sign --yes "ghcr.io/re8ch/among-clusters@$DIGEST"
      - name: Attest runtime image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/re8ch/among-clusters
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Package and publish four OCI charts
        run: |
          version=${GITHUB_REF_NAME#v}
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ github.token }}"
          helm dependency build charts/among-clusters
          mkdir -p dist
          for chart in among-clusters-hub among-clusters-agent among-clusters-headlamp among-clusters; do
            helm package charts/$chart --destination dist
            for attempt in 1 2 3; do
              if helm push "dist/$chart-$version.tgz" oci://ghcr.io/re8ch/charts; then
                break
              fi
              test "$attempt" -lt 3
              sleep $((attempt * 5))
            done
            cosign sign --yes "ghcr.io/re8ch/charts/$chart:$version"
            oras push ghcr.io/re8ch/charts/$chart:artifacthub.io \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              "artifacthub/helm/$chart/artifacthub-repo.yml":application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
            cosign sign --yes ghcr.io/re8ch/charts/$chart:artifacthub.io
          done
      - name: Verify and publish native Headlamp archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          echo '47d9658c3e8596e99a13dd86c9dd273078917176fe4529d35467d18d6c59ce4f  charts/among-clusters-headlamp/files/plugin.tar.gz' | sha256sum -c -
          cp charts/among-clusters-headlamp/files/plugin.tar.gz \
            "dist/re8ch-headlamp-among-clusters-$version.tar.gz"
          for asset in dist/*.tgz dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "${asset}.bundle.json" "$asset"
            (cd dist && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")
          done
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
