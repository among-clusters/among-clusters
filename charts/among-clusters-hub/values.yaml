image:
  repository: ghcr.io/among-clusters/among-clusters
  digest: ""
adminTokenSecret: among-clusters-hub-admin
reconcileInterval: 60s
replicaCount: 2
nodeSelector: {}
managedAccess:
  enabled: false
  broker:
    hostname: ""
    namespace: credential-broker
migration:
  replaceCollaborationCRDs: false
hostname: among-clusters.re8ch.com
gateway:
  name: re8ch-gateway-canary
  namespace: kube-system
certificate:
  issuer: re8ch-cloudflare-dns01
publication:
  bootstrapTarget: ""
  selectedEdge: ""
ciliumPolicy:
  enabled: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
# Optional HTTP diagnostics. Public DSN or an existing Secret reference, not both.
# No release-automation token belongs in runtime.
sentry:
  enabled: false
  dsn: ""
  dsnSecretRef: {name: "", key: dsn}
  release: ""
  environment: ""
