apiVersion: apps/v1
kind: Deployment
metadata: {name: among-clusters-hub}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: among-clusters-hub}}
  template:
    metadata: {labels: {app.kubernetes.io/name: among-clusters-hub}}
    spec:
      serviceAccountName: among-clusters-hub
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          command: [/hub]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: "{{ .Values.adminTokenSecret }}", key: token}}
            - {name: MANAGED_ACCESS_ENABLED, value: {{ .Values.managedAccess.enabled | quote }}}
            - {name: RECONCILE_INTERVAL, value: {{ .Values.reconcileInterval | quote }}}
            {{- include "among-clusters-hub.sentryEnv" . | nindent 12 }}
          ports: [{name: http, containerPort: 8080}, {name: metrics, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: among-clusters-hub, labels: {app.kubernetes.io/name: among-clusters-hub}}
spec: {selector: {app.kubernetes.io/name: among-clusters-hub}, ports: [{name: http, port: 80, targetPort: http}, {name: metrics, port: 9090, targetPort: metrics}]}
