{{- if .Values.ciliumPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: among-clusters-hub-gateway}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: among-clusters-hub}}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability-system
            k8s:app.kubernetes.io/name: vmagent
            k8s:app.kubernetes.io/instance: re8ch
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
{{- end }}
